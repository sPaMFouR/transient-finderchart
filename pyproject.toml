[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "findingchart-guiplotter"
version = "0.1.0"
description = "PySide6 finding chart plotter for supernova observations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6>=6.5",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "requests>=2.31",
  "urllib3<2",
  "Pillow>=10.0",
  "scipy>=1.10",
  "photutils>=1.9",
  "SciencePlots>=2.1",
  "pypalettes>=0.1",
]

[project.scripts]
findingchart-guiplotter = "findingchart_guiplotter.gui:main"
findingchart-web = "findingchart_guiplotter.web:main"
